name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy APK for Release
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk YatraFlow.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YatraFlow-Android-APK
          path: YatraFlow.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: YatraFlow Android Release v1.0.0
          body: |
            ## YatraFlow - Smart Tourism & Crowd Optimization Mobile App (SIH 2026)
            
            Download `YatraFlow.apk` below and open it on your Android phone to install!
          files: YatraFlow.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
